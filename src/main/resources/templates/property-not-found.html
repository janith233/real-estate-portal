<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Property Not Found</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<header class="bg-white shadow-sm">
    <div class="w-full px-10 lg:px-16 py-4 flex justify-between items-center">

        <a href="/" class="text-xl font-bold text-gray-800">
            Real Estate Portal
        </a>

        <a href="/properties"
           class="text-gray-600 hover:text-blue-600 transition">
            Properties
        </a>

    </div>
</header>


<main class="min-h-screen flex items-center justify-center px-6 py-16">

    <div class="bg-white rounded-2xl shadow-lg max-w-lg w-full p-10 text-center">

        <div class="mb-5">

            <p class="text-6xl font-bold text-gray-300">
                404
            </p>

        </div>

        <h1 class="text-3xl font-bold text-gray-800 mb-3">
            Property Not Found
        </h1>

        <p class="text-gray-600 mb-8">
            Sorry, the property you are looking for does not exist.
        </p>

        <a href="/properties"
           class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg
                  font-semibold hover:bg-blue-700 transition">
            Back to Properties
        </a>

    </div>

</main>

</body>
</html>
