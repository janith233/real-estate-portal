<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Property Details</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<!-- Navigation -->
<header class="bg-white shadow-sm">
    <div class="w-full px-10 lg:px-16 py-4 flex justify-between items-center">

        <a href="/" class="text-xl font-bold text-gray-800">
            Real Estate Portal
        </a>

        <a href="/properties"
           class="text-gray-600 hover:text-blue-600 transition">
            Properties
        </a>

    </div>
</header>


<!-- Main Content -->
<main class="max-w-4xl mx-auto px-6 py-10">

    <!-- Back Link -->
    <a href="/properties"
       class="inline-block text-blue-600 hover:text-blue-800
              font-semibold mb-6 transition">
        ← Back to Properties
    </a>


    <!-- Property Details Card -->
    <div class="bg-white rounded-2xl shadow-lg p-8">

        <!-- Title -->
        <div class="mb-6">

            <span class="inline-block bg-blue-100 text-blue-700
                         text-sm font-semibold px-3 py-1 rounded-full mb-3"
                  th:text="${property.propertyType}">
            </span>

            <h1 class="text-4xl font-bold text-gray-800"
                th:text="${property.title}">
            </h1>

        </div>


        <!-- Price -->
        <div class="bg-gray-50 rounded-xl p-5 mb-6">

            <p class="text-sm text-gray-500 mb-1">
                Property Price
            </p>

            <p class="text-3xl font-bold text-blue-600">

                Rs.
                <span th:text="${#numbers.formatDecimal(property.price, 0, 'COMMA', 2, 'POINT')}">
                </span>

            </p>

        </div>


        <!-- Property Information -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">

            <!-- Location -->
            <div class="border border-gray-200 rounded-xl p-5">

                <p class="text-sm text-gray-500 mb-1">
                    Location
                </p>

                <p class="text-lg font-semibold text-gray-800"
                   th:text="${property.location}">
                </p>

            </div>


            <!-- Property Type -->
            <div class="border border-gray-200 rounded-xl p-5">

                <p class="text-sm text-gray-500 mb-1">
                    Property Type
                </p>

                <p class="text-lg font-semibold text-gray-800"
                   th:text="${property.propertyType}">
                </p>

            </div>


            <!-- Bedrooms -->
            <div th:if="${property.propertyType == 'House'}"
                 class="border border-gray-200 rounded-xl p-5">

                <p class="text-sm text-gray-500 mb-1">
                    Bedrooms
                </p>

                <p class="text-lg font-semibold text-gray-800"
                   th:text="${property.numberOfBedrooms}">
                </p>

            </div>


            <!-- Floor -->
            <div th:if="${property.propertyType == 'Apartment'}"
                 class="border border-gray-200 rounded-xl p-5">

                <p class="text-sm text-gray-500 mb-1">
                    Floor Number
                </p>

                <p class="text-lg font-semibold text-gray-800"
                   th:text="${property.floorNumber}">
                </p>

            </div>

        </div>


        <!-- Description -->
        <div class="border-t border-gray-200 pt-6">

            <h2 class="text-xl font-bold text-gray-800 mb-3">
                Description
            </h2>

            <p class="text-gray-600 leading-relaxed"
               th:text="${property.description}">
            </p>

        </div>


        <!-- Actions -->
        <div class="flex flex-wrap gap-3 mt-8">

            <a th:href="@{/properties/edit/{id}(id=${property.id})}"
               class="bg-blue-600 text-white px-5 py-3 rounded-lg
                      font-semibold hover:bg-blue-700 transition">
                Edit Property
            </a>

            <a href="/properties"
               class="bg-gray-200 text-gray-700 px-5 py-3 rounded-lg
                      font-semibold hover:bg-gray-300 transition">
                Back to Properties
            </a>

        </div>

    </div>

</main>

</body>
</html>
