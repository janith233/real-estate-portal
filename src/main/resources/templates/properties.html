<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Properties</title>
</head>
<body>

<h1>Available Properties</h1>

<h2>Add New Property</h2>

<form action="/properties/add" method="post">

    <label>Title:</label>
    <input type="text" name="title" required>
    <br><br>

    <label>Location:</label>
    <input type="text" name="location" required>
    <br><br>

    <label>Price:</label>
    <input type="number" name="price" required>
    <br><br>

    <label>Property Type:</label>
    <input type="text" name="propertyType" required>
    <br><br>

    <label>Description:</label>
    <textarea name="description" required></textarea>
    <br><br>

    <button type="submit">Add Property</button>

</form>

<hr>

<div th:each="property : ${properties}">

    <h2 th:text="${property.title}"></h2>

    <p th:text="${property.location}"></p>

    <p th:text="${property.price}"></p>

    <p th:text="${property.propertyType}"></p>

    <p th:text="${property.description}"></p>

    <a th:href="@{/properties/{id}(id=${property.id})}">
      View Details
    </a>

    <a th:href="@{/properties/edit/{id}(id=${property.id})}">
        Edit
    </a>    

    <form action="/properties/delete" method="post">

        <input type="hidden" name="id" th:value="${property.id}">

        <button type="submit">Delete</button>

    </form>

<hr>

</div>

</body>
</html>
